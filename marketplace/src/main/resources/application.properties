spring.application.name=marketplace
# MySQL Database connection (Render/External)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=${PORT:8080}

# SMTP Mail Configuration (Removed)
# We are now using SendGrid HTTP API to bypass Render's strict port 587 blocks.
# Make sure your Render dashboard has the following Environment Variable set:
# SENDGRID_API_KEY=SG.xxxxxxxxxxxxxx
# Your sender email is still pulled from here:
spring.mail.username=anuragmarketplace@gmail.com


# File Upload Limits
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1